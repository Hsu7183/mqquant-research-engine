.plot canvas, .timecanvas {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.workspace {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  min-height: 100vh;
  min-height: 100dvh;
  align-items: stretch;
}
.chart-shell {
  container: chart / inline-size;
  min-width: 0;
}
.chart-shell .screen { width: 100%; max-width: none; margin: 0; }
.strategy-pane {
  min-width: 0;
  border-left: 1px solid #33434d;
  background: #0b1014;
}
.strategy-pane h2 {
  display: flex;
  align-items: center;
  height: 54px;
  margin: 0;
  padding: 0 18px;
  border-bottom: 1px solid #23343e;
  background: #10212d;
  color: #d0dce3;
  font-size: 16px;
  font-weight: 500;
}
.navfloat { opacity: .72; }
.screen.inspect .navfloat, .mainplot:hover .navfloat { opacity: .95; }
.navfloat button { min-width: 28px; min-height: 28px; }
.workspace-switch { display: none; }
@media (max-width: 719px) {
  .workspace {
    grid-template-rows: 36px 1fr;
    align-content: start;
  }
  .workspace-switch {
    display: flex;
    grid-column: 1 / -1;
    align-items: stretch;
    height: 36px;
    padding-left: max(8px, env(safe-area-inset-left));
    border-bottom: 1px solid #263a47;
    background: #091924;
  }
  .workspace-switch label {
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: 0 13px;
    font-size: 14px;
    color: #99adb8;
    cursor: pointer;
  }
  .workspace-switch input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
  .workspace-switch label:has(:checked) { color: white; box-shadow: inset 0 -2px #58b3eb; }
  .workspace-switch label:has(:focus-visible) { outline: 2px solid var(--gold); outline-offset: -2px; }
  .chart-shell .screen { height: calc(100vh - 36px); height: calc(100dvh - 36px); }
  .workspace:has(#chartView:checked) .chart-shell,
  .workspace:has(#strategyView:checked) .strategy-pane { grid-column: 1 / -1; }
  .workspace:has(#chartView:checked) .strategy-pane,
  .workspace:has(#strategyView:checked) .chart-shell { display: none; }
  .workspace:has(#strategyView:checked) .strategy-pane { border-left: 0; }
  .strategy-pane h2 { height: 46px; padding: 0 10px; font-size: 14px; }
}
@container chart (max-width: 320px) {
  .head { display: flex; justify-content: center; padding: 0 3px; }
  .head .mark { display: none; }
  .market { gap: 0; min-width: 0; }
  .title { padding: 0 2px; font-size: 15px; white-space: nowrap; }
  .title small { font-size: 10px; }
  .daystep { width: 20px; flex: none; padding: 0; }
  .top, .facts, .modes { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; }
  .top { gap: 5px; padding: 3px; }
  .top > *, .modes > * { flex: none; }
  .top .spacer { display: none; }
  .top .picker select { min-width: 53px; padding-left: 4px; font-size: 14px; }
  .top .key { padding: 2px 6px; font-size: 14px; }
  .top .iconkey { width: 28px; }
  .facts { grid-template-columns: repeat(6, 52px) 24px; }
  .closeq { padding: 0; }
  .navfloat { right: calc(var(--rail, 54px) + 1px); bottom: 3px; gap: 1px; }
  .navfloat button { min-width: 20px; min-height: 24px; width: 20px; height: 24px; padding: 0; }
  .modes { justify-content: start; }
  .modes button { padding: 5px 6px; white-space: nowrap; }
  .tag { min-width: 40px; font-size: 13px; padding: 0 2px; }
  .collapse { width: 25px; }
}

 if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}

function stroke(g,x1,y1,x2,y2,col,width=1){

function xLabels(){
 const maxTicks=clamp(Math.floor((screenWidth-rail)/115),2,9);
 if(n===1440){const every=Math.max(1,Math.ceil(count/maxTicks));return Array.from({length:count},(_,j)=>j).filter(j=>j%every===0)}
 const span=rows[start+count-1][0]-rows[start][0]+n;
 const choices=[1,2,3,5,10,15,30,60,120,180];
 const step=choices.find(v=>v>=span/maxTicks)||240;
 let prev=-1;const ticks=[];
 for(let j=0;j<count;j++){const m=rows[start+j][0];const bin=Math.floor(m/step);if(bin!==prev&&(j>0||m%step===0))ticks.push(j);prev=bin}
 return ticks;
}
function formatAxis(num,kind){
 if(kind==='price'&&percent){const rawBase=n===1440?rows[start][19]:data[1440].days[day][0][19];const base=Number.isFinite(rawBase)?rawBase:(n===1440?rows[start][1]:data[1440].days[day][0][1]);return format((num/base-1)*100,2)+'%'}

function labelBox(ctx,x,y,text,color){
 const {g,h,w,pw}=ctx;const height=screenWidth<=700?17:20;
 const top=clamp(y-height/2,0,h-height);g.fillStyle=color;g.fillRect(pw,top,w-pw,height);
 g.textAlign='center';g.textBaseline='middle';g.fillStyle='#050505';g.fillText(text,(w+pw)/2,top+height/2);
}
function drawSeries(ctx,col,field,y){
 const {g,x}=ctx;g.beginPath();g.lineWidth=screenWidth<=700?1.15:1.45;g.strokeStyle=col;
 let drawing=false;for(let j=0;j<count;j++){const point=rows[start+j][field];if(!Number.isFinite(point)){drawing=false;continue}if(!drawing){g.moveTo(x(j),y(point));drawing=true}else g.lineTo(x(j),y(point))}

function drawPanel(kind,ticks){
 const ctx=canvasSetup(kind);if(!ctx)return;
 const {g,w,h,pw,dx,x}=ctx;const view=rows.slice(start,start+count);
 let lo=0,hi=100,lines=[],tickValues;
 if(kind==='price'){
  lo=Math.min(...view.flatMap(b=>(useMa?[b[3],b[6],b[7],b[8]]:[b[3]]).filter(Number.isFinite)));
  hi=Math.max(...view.flatMap(b=>(useMa?[b[2],b[6],b[7],b[8]]:[b[2]]).filter(Number.isFinite)));
  const pad=Math.max(1,(hi-lo)*.1);lo-=pad;hi+=pad;
  lines=useMa?maSeries:[];
 }else if(kind==='macd'){
  hi=Math.max(.5,...view.flatMap(b=>[b[9],b[10],b[11]].filter(Number.isFinite).map(Math.abs)))*1.12;lo=-hi;lines=descriptors.macd.series.slice(0,2);
 }else if(kind==='vol'){
  hi=Math.max(1,...view.flatMap(b=>[b[5],b[17],b[18]]))*1.05;lines=descriptors.vol.series;
 }else{lines=descriptors[kind].series;tickValues=[20,50,80]}
 const y=v=>h-1-(v-lo)/(hi-lo)*(h-2);
 g.fillStyle=palette.axis;g.fillRect(pw,0,rail,h);
 g.font=(screenWidth<=700?'14px':'14px')+' Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';
 const gridN=kind==='price'||h>=100?4:2;
 const levels=tickValues||Array.from({length:gridN+1},(_,i)=>lo+(hi-lo)*i/gridN);
 for(const tick of levels){const yy=y(tick);stroke(g,0,yy,pw,yy,palette.grid);g.fillStyle='#e3e4e4';g.fillText(formatAxis(tick,kind),pw+rail/2,clamp(yy,8,h-8))}
 g.save();g.beginPath();g.rect(0,0,pw,h);g.clip();
 for(const j of ticks)stroke(g,x(j),0,x(j),h,'#222526');
 const barWidth=Math.max(1,Math.min(36,dx*.77));
 for(let j=0;j<count;j++){
  const b=view[j],xx=x(j),color=b[4]>b[1]?palette.red:b[4]<b[1]?palette.green:palette.flat;
  if(kind==='price'){
   stroke(g,xx,y(b[2]),xx,y(b[3]),'#b9b9b9',Math.max(1,Math.min(1.5,dx*.16)));
   g.fillStyle=color;g.fillRect(xx-barWidth/2,Math.min(y(b[1]),y(b[4])),barWidth,Math.max(1.25,Math.abs(y(b[4])-y(b[1]))));
  }else if(kind==='vol'||kind==='macd'){
   const v=kind==='vol'?b[5]:b[11];if(!Number.isFinite(v))continue;g.fillStyle=kind==='vol'?color:(v>=0?palette.red:palette.green);
   g.fillRect(xx-barWidth/2,Math.min(y(0),y(v)),barWidth,Math.max(1,Math.abs(y(v)-y(0))));
  }
 }
 for(const [field,,color] of lines)drawSeries(ctx,palette[color],field,y);
 if(kind==='price'){
  const extreme=(field,isHi)=>{
   const value=(isHi?Math.max:Math.min)(...view.map(b=>b[field]));const j=view.findIndex(b=>b[field]===value);
   const label=format(value);g.font='bold '+(screenWidth<=700?'13':'15')+'px Arial';g.fillStyle=isHi?palette.red:palette.green;

  };
  extreme(2,true);extreme(3,false);
 }
 if(selected!==null){const xx=x(selected-start);stroke(g,xx,0,xx,h,palette.amber,1.2)}
 g.restore();g.font=(screenWidth<=700?'14':'15')+'px Arial, sans-serif';
 if(kind==='price'){

 }
 if(selected!==null&&(kind==='price'||kind==='vol')){

function drawTimeline(ticks){

function setupPointer(){
 const holdMs=1000, moveTolerance=8;
 const pointers=new Map();
 let gesture=null, holdTimer=null;
 function cancelHold(){clearTimeout(holdTimer);holdTimer=null}
 function reset(){cancelHold();pointers.clear();gesture=null}
 function barAt(fraction){return start+clamp(Math.floor(fraction*count),0,count-1)}
 function pinchSpan(){
  const [a,b]=pointers.values();
  return {distance:Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),center:(a.fraction+b.fraction)/2};
 }
 function finish(event){
  if(!pointers.delete(event.pointerId))return;
  cancelHold();
  // After a pinch, lift both fingers before starting a new drag or hold.
  gesture=null;
 }
 window.addEventListener('blur',reset);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});
 for(const id of ['price','timeAxis',...Object.keys(descriptors)]){
  const canvas=el(id);
  function point(event){
   const rect=canvas.getBoundingClientRect();
   return {x:event.clientX,y:event.clientY,fraction:(event.clientX-rect.left)/Math.max(1,rect.width-rail)};
  }
  canvas.addEventListener('contextmenu',event=>event.preventDefault());
  canvas.addEventListener('pointerdown',event=>{
   if(event.button!==0||pointers.size>=2)return;
   const p=point(event);
   if(p.fraction<0||p.fraction>=1)return;
   cancelHold();
   canvas.setPointerCapture(event.pointerId);
   pointers.set(event.pointerId,p);
   if(pointers.size===2){
    const span=pinchSpan();
    gesture={type:'pinch',distance:span.distance,anchor:start+count*span.center,count};
    return;
   }
   gesture={type:'single',x:p.x,y:p.y,start,moved:false};
   const held=gesture;
   holdTimer=setTimeout(()=>{
    if(gesture!==held||pointers.size!==1)return;
    if(selected===null)queryAt(barAt(p.fraction));else closeQuery();
    holdTimer=null;
   },holdMs);
   if(selected!==null)queryAt(barAt(p.fraction));
  });
  canvas.addEventListener('pointermove',event=>{
   if(!pointers.has(event.pointerId)||!gesture)return;
   const p=point(event);
   pointers.set(event.pointerId,p);
   if(gesture.type==='pinch'){
    const span=pinchSpan();
    count=clamp(Math.round(gesture.count*gesture.distance/span.distance),Math.min(8,rows.length),rows.length);
    start=clamp(Math.round(gesture.anchor-count*span.center),0,rows.length-count);
    if(selected!==null)selected=clamp(selected,start,start+count-1);
    queue();
    return;
   }
   const dx=p.x-gesture.x;
   if(!gesture.moved&&Math.hypot(dx,p.y-gesture.y)>moveTolerance){
    gesture.moved=true;
    cancelHold();
   }
   if(selected!==null)queryAt(barAt(p.fraction));
   else if(gesture.moved){
    const barWidth=(canvas.getBoundingClientRect().width-rail)/count;
    start=clamp(gesture.start-Math.round(dx/barWidth),0,rows.length-count);
    queue();
   }
  });
  for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,finish);
  canvas.addEventListener('wheel',event=>{
   if(!event.ctrlKey&&!event.shiftKey)return;
   event.preventDefault();
   if(event.ctrlKey)zoom(event.deltaY>0?1.25:.8);else shift(event.deltaY>0?1:-1);
  },{passive:false});
 }
}

 el('closeDialog').onclick=()=>el('dialog').close();el('dialog').onclick=e=>{if(e.target===el('dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};

}
function decode64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function boot(){
 try{
  let bytes=decode64(el('payload').textContent.trim());
  if(el('payload').dataset.encrypted==='yes'){
   const k=new URLSearchParams(location.hash.slice(1)).get('k');
   if(!k){el('loading').textContent='請使用取得的完整看盤連結開啟（含 #k=）。';return}
   const key=await crypto.subtle.importKey('raw',decode64(k.replaceAll('-','+').replaceAll('_','/')),{name:'AES-GCM'},false,['decrypt']);
   bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12)));
  }
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  data=calculateDataset(await new Response(stream).json());setup();
 }catch(e){el('loading').textContent='無法讀取看盤資料。請用最新版 Safari、Chrome 或 Edge 開啟完整連結。';console.error(e)}
}
