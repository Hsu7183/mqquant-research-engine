 if(n===1440){const every=Math.max(1,Math.ceil(count/maxTicks));return Array.from({length:count},(_,j)=>j).filter(j=>j%every===0)}
 const span=rows[start+count-1][0]-rows[start][0]+n;
 const choices=[1,2,3,5,10,15,30,60,120,180];
 const step=choices.find(v=>v>=span/maxTicks)||240;
 let prev=-1;const ticks=[];
 for(let j=0;j<count;j++){const m=rows[start+j][0];const bin=Math.floor(m/step);if(bin!==prev&&(j>0||m%step===0))ticks.push(j);prev=bin}
 return ticks;
}
function formatAxis(num,kind){
 if(kind==='price'&&percent){const base=n===1440?rows[start][19]:data[1440].days[day][0][19];return format((num/base-1)*100,2)+'%'}
 if(kind==='macd')return format(num,Math.abs(num)<10?1:0);
 return format(num,0);
}
function labelBox(ctx,x,y,text,color){
 const {g,h,w,pw}=ctx;const height=screenWidth<=700?17:20;
 const top=clamp(y-height/2,0,h-height);g.fillStyle=color;g.fillRect(pw,top,w-pw,height);
 g.textAlign='center';g.textBaseline='middle';g.fillStyle='#050505';g.fillText(text,(w+pw)/2,top+height/2);
}
function drawSeries(ctx,col,field,y){
 const {g,x}=ctx;g.beginPath();g.lineWidth=screenWidth<=700?1.15:1.45;g.strokeStyle=col;
 for(let j=0;j<count;j++){const point=rows[start+j][field];if(j===0)g.moveTo(x(j),y(point));else g.lineTo(x(j),y(point))}
 g.stroke();
}
function drawPanel(kind,ticks){
 const ctx=canvasSetup(kind);if(!ctx)return;
 const {g,w,h,pw,dx,x}=ctx;const view=rows.slice(start,start+count);
 let lo=0,hi=100,lines=[],tickValues;
 if(kind==='price'){
  lo=Math.min(...view.map(b=>useMa?Math.min(b[3],b[6],b[7],b[8]):b[3]));
  hi=Math.max(...view.map(b=>useMa?Math.max(b[2],b[6],b[7],b[8]):b[2]));
  const pad=Math.max(1,(hi-lo)*.1);lo-=pad;hi+=pad;
  lines=useMa?maSeries:[];
 }else if(kind==='macd'){
  hi=Math.max(.5,...view.flatMap(b=>[Math.abs(b[9]),Math.abs(b[10]),Math.abs(b[11])]))*1.12;lo=-hi;lines=descriptors.macd.series.slice(0,2);
 }else if(kind==='vol'){
  hi=Math.max(1,...view.flatMap(b=>[b[5],b[17],b[18]]))*1.05;lines=descriptors.vol.series;
 }else{lines=descriptors[kind].series;tickValues=[20,50,80]}
 const y=v=>h-1-(v-lo)/(hi-lo)*(h-2);
 g.fillStyle=palette.axis;g.fillRect(pw,0,rail,h);
 g.font=(screenWidth<=700?'14px':'14px')+' Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';
 const gridN=kind==='price'||h>=100?4:2;
 const levels=tickValues||Array.from({length:gridN+1},(_,i)=>lo+(hi-lo)*i/gridN);
 for(const tick of levels){const yy=y(tick);stroke(g,0,yy,pw,yy,palette.grid);g.fillStyle='#e3e4e4';g.fillText(formatAxis(tick,kind),pw+rail/2,clamp(yy,8,h-8))}
 g.save();g.beginPath();g.rect(0,0,pw,h);g.clip();
 for(const j of ticks)stroke(g,x(j),0,x(j),h,'#222526');
 const barWidth=Math.max(1,Math.min(36,dx*.77));
 for(let j=0;j<count;j++){
  const b=view[j],xx=x(j),color=b[4]>b[1]?palette.red:b[4]<b[1]?palette.green:palette.flat;
  if(kind==='price'){
   stroke(g,xx,y(b[2]),xx,y(b[3]),'#b9b9b9',Math.max(1,Math.min(1.5,dx*.16)));
   g.fillStyle=color;g.fillRect(xx-barWidth/2,Math.min(y(b[1]),y(b[4])),barWidth,Math.max(1.25,Math.abs(y(b[4])-y(b[1]))));
  }else if(kind==='vol'||kind==='macd'){
   const v=kind==='vol'?b[5]:b[11];g.fillStyle=kind==='vol'?color:(v>=0?palette.red:palette.green);
   g.fillRect(xx-barWidth/2,Math.min(y(0),y(v)),barWidth,Math.max(1,Math.abs(y(v)-y(0))));
  }
 }
 for(const [field,,color] of lines)drawSeries(ctx,palette[color],field,y);
 if(kind==='price'){
  const extreme=(field,isHi)=>{
   const value=(isHi?Math.max:Math.min)(...view.map(b=>b[field]));const j=view.findIndex(b=>b[field]===value);
   const label=format(value);g.font='bold '+(screenWidth<=700?'13':'15')+'px Arial';g.fillStyle=isHi?palette.red:palette.green;
   const half=g.measureText(label).width/2+2;g.fillText(label,clamp(x(j),half,pw-half),clamp(y(value)+(isHi?-8:10),8,h-7));
  };
  extreme(2,true);extreme(3,false);
 }
 if(selected!==null){const xx=x(selected-start);stroke(g,xx,0,xx,h,palette.amber,1.2)}
 g.restore();g.font=(screenWidth<=700?'14':'15')+'px Arial, sans-serif';
 if(kind==='price'){
  const tail=view.at(-1)[4];if(tail>=lo&&tail<=hi){stroke(g,0,y(tail),pw,y(tail),'#8e8e8e',.8);labelBox(ctx,pw,y(tail),formatAxis(tail,kind),'#afb0b0')}
 }
 if(selected!==null&&(kind==='price'||kind==='vol')){
  const val=rows[selected][kind==='price'?4:5];stroke(g,0,y(val),pw,y(val),palette.amber,1.1);
  labelBox(ctx,pw,y(val),formatAxis(val,kind),palette.amber);
 }
}
function drawTimeline(ticks){
 const ctx=canvasSetup('timeAxis');if(!ctx)return;const {g,h,pw,x}=ctx;
 g.font='13px Arial';g.textBaseline='middle';g.textAlign='center';
 for(const j of ticks){g.fillStyle='#c0c7cb';g.fillText(n===1440?dayShort(labels[start+j]):time(rows[start+j][0]),clamp(x(j),20,pw-20),h/2)}
 if(selected!==null){
  const text=dayShort(labels[selected])+(n===1440?'':' '+time(rows[selected][0]));
  const width=g.measureText(text).width+10;
  const left=clamp(x(selected-start)-width/2,0,pw-width);g.fillStyle=palette.amber;g.fillRect(left,0,width,h);
  g.fillStyle='#060606';g.fillText(text,left+width/2,h/2);
 }
}
function legend(id,series,bar,previous,enabled=true){
 const target=el(id);const html=enabled?series.map(([i,label,color])=>{
  const arrow=bar[i]>previous[i]?'↑':bar[i]<previous[i]?'↓':'→';
  const decimals=i>=6&&i<=8?1:i>=17?1:2;
  return '<span style="color:'+palette[color]+'">'+label+' '+format(bar[i],decimals)+arrow+'</span>';
 }).join(''):'<span style="color:#889399">均線已隱藏</span>';
 if(target.innerHTML!==html)target.innerHTML=html;
}
function queryRow(bar,index){
 const z=bar[19];const cs=v=>v>z?'up':v<z?'down':'flat';
 const fields=[[n===1440?'日':'時',n===1440?dayShort(labels[index]):time(bar[0]),'yellow'],['開',bar[1],cs(bar[1])],['高',bar[2],cs(bar[2])],['低',bar[3],cs(bar[3])],['收',bar[4],cs(bar[4])],['量',bar[5],'yellow']];
 el('facts').innerHTML=fields.map(([label,value,color])=>'<div class="fact"><small>'+label+'</small><b class="'+color+'">'+value+'</b></div>').join('')+'<button class="closeq" id="exitQuery" aria-label="退出查價">×</button>';
 el('exitQuery').onclick=closeQuery;
}
function render(){
 if(!data||!rows.length)return;
 const query=selected!==null;
 el('toolbar').hidden=query;el('facts').hidden=!query;el('screen').classList.toggle('inspect',query);
 screenWidth=el('pricebox').getBoundingClientRect().width;rail=clamp(Math.round(screenWidth*.145),54,79);
 el('screen').style.setProperty('--rail',rail+'px');
 const i=activeIndex(),b=rows[i],p=i>0?rows[i-1]:prior;
 if(query)queryRow(b,i);
 legend('maVal',maSeries,b,p,useMa);
 const ticks=xLabels();drawPanel('price',ticks);drawTimeline(ticks);
 for(const id of visible){legend(id+'Val',descriptors[id].series,b,p);if(!collapsed.has(id))drawPanel(id,ticks)}
 el('zoomIn').disabled=count<=Math.min(8,rows.length);el('zoomOut').disabled=count>=rows.length;
 el('backBar').disabled=query?selected<=0:start<=0;el('forwardBar').disabled=query?selected>=rows.length-1:start+count>=rows.length;
}
function calendarHTML(){
 const offset=(new Date(Date.UTC(2025,11,1)).getUTCDay()+6)%7;
 let text='<p>2025 年 12 月　·　22 個交易日</p><div class="cal">';
 for(const week of '一二三四五六日')text+='<small>'+week+'</small>';
 for(let k=0;k<offset;k++)text+='<span></span>';
 for(let k=1;k<=31;k++){const d='2025-12-'+String(k).padStart(2,'0');text+=days.includes(d)?'<button data-date="'+d+'" aria-current="'+(d===day)+'">'+k+'</button>':'<span class="blankday">'+k+'</span>'}
 return text+'</div><div class="footnote">灰字日期沒有日盤 K 棒。選擇日期後，切換至該交易日。</div>';
}
function openDialog(type){
 const names={dates:'選擇交易日',settings:'技術指標設定',info:'資料與計算'};
 el('dialogtitle').textContent=names[type];const target=el('dialogcontent');
 if(type==='dates'){
  target.innerHTML=calendarHTML();
  target.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{changeDay(b.dataset.date);el('dialog').close()});
 }else if(type==='settings'){
  const choices=[['ma','MA 均線','5、10、20'],['macd','MACD','12、26、9'],['kd','KD','9、3、3'],['rsi','RSI','5、10；短線均值 14'],['vol','VOL 成交量','5、10 期均量']];
  target.innerHTML='<fieldset>'+choices.map(([id,label,params])=>'<label><input type="checkbox" data-choice="'+id+'" '+((id==='ma'?useMa:visible.has(id))?'checked':'')+'>'+label+'<small>'+params+'</small></label>').join('')+'</fieldset><div class="widebuttons"><button class="dialogbtn" id="applyDone">完成</button></div>';
  target.querySelectorAll('[data-choice]').forEach(b=>b.onchange=()=>{const id=b.dataset.choice;if(id==='ma')useMa=b.checked;else{if(b.checked){visible.add(id);collapsed.delete(id)}else visible.delete(id)}mode='custom';layout()});
  el('applyDone').onclick=()=>el('dialog').close();
 }else{
  target.innerHTML='<p><strong>大台指（TX）日盤</strong><br>2025/12/01 至 2025/12/31，22 個交易日，共 6,585 根 1 分 K。以臺灣時間及每根的起始分鐘標示。</p><p>一般交易日 08:45–13:44，各 300 根。12/17 為 08:45–13:29，共 285 根。只繪製原始檔內的價量。</p><p class="datafile">來源：TX_日盤1分K_20200101_20251231.csv。以每日 08:45 為分組起點，分 K 與日 K 均取首開、最高、最低、末收並加總量。日 K 僅彙整日盤。</p><p>MA 是收盤價的 5、10、20 期簡單均線。MACD 使用 EMA12 減 EMA26 得到 DIF，再取 DIF 的 EMA9 作為訊號線。OSC 為兩線之差。</p><p>KD 取近 9 根高低計算 RSV，K、D 各以 1/3 權重平滑。RSI 採 Wilder 平滑，分別計算 5、10 期，紫線為 RSI5 的 14 期簡單均線。VOL 為成交口數，疊加 5、10 期均量。</p><p>各週期先從原始歷史序列起點（2020/01/02）計算，再擷取 2025 年 12 月。分 K 跨交易日延續指標。每根指標值包含該根收盤，策略在開盤判斷時應讀前一根已完成的值。</p><p>點選圖表進入查價，水平滑動可逐根查看。一般模式拖曳可平移，＋／− 改變可見根數。點標題選擇交易日。</p>';
 }
 if(!el('dialog').open)el('dialog').showModal();
}
function setupPointer(){
 for(const id of ['price','timeAxis',...Object.keys(descriptors)]){
  const canvas=el(id);
  function point(event){const rect=canvas.getBoundingClientRect();return {x:event.clientX-rect.left,tick:(rect.width-rail)/count}}
  canvas.addEventListener('pointerdown',event=>{
   if(event.button!==0||drag)return;const p=point(event);if(p.x<0||p.x>=canvas.clientWidth-rail)return;
   drag={id:event.pointerId,x:p.x,start,query:selected!==null,moved:false};canvas.setPointerCapture(event.pointerId);
   if(drag.query)queryAt(start+Math.floor(p.x/p.tick));
  });
  canvas.addEventListener('pointermove',event=>{
   if(!drag||drag.id!==event.pointerId)return;const p=point(event),delta=p.x-drag.x;drag.moved ||=Math.abs(delta)>4;
   if(drag.query)queryAt(start+clamp(Math.floor(p.x/p.tick),0,count-1));
   else if(drag.moved){start=clamp(drag.start-Math.round(delta/p.tick),0,rows.length-count);queue()}
  });
  canvas.addEventListener('pointerup',event=>{
   if(!drag||drag.id!==event.pointerId)return;const p=point(event);
   if(!drag.moved&&!drag.query)queryAt(start+clamp(Math.floor(p.x/p.tick),0,count-1));
   drag=null;
  });
  canvas.addEventListener('pointercancel',()=>{drag=null});
  canvas.addEventListener('wheel',event=>{if(!event.ctrlKey&&!event.shiftKey)return;event.preventDefault();event.ctrlKey?zoom(event.deltaY>0?1.25:.8):shift(event.deltaY>0?1:-1)},{passive:false});
 }
}
function setup(){
 addPanes();allButtons('[data-dialog]',b=>openDialog(b.dataset.dialog));
 el('closeDialog').onclick=()=>el('dialog').close();el('dialog').onclick=e=>{if(e.target===el('dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};
 allButtons('[data-mode]',b=>{mode=b.dataset.mode;useMa=true;visible=new Set(presets[mode]);collapsed.clear();layout()});
 el('prevDay').onclick=()=>changeDay(days[days.indexOf(day)-1]);el('nextDay').onclick=()=>changeDay(days[days.indexOf(day)+1]);
 el('period').onchange=e=>usePeriod(e.target.value);el('query').onclick=()=>queryAt(activeIndex());
 el('backBar').onclick=()=>shift(-1);el('forwardBar').onclick=()=>shift(1);el('zoomIn').onclick=()=>zoom(.72);el('zoomOut').onclick=()=>zoom(1.4);
 el('fit').onclick=()=>{count=rows.length;start=0;queue()};
 el('focus').onclick=()=>{const on=el('screen').classList.toggle('focus');el('focus').setAttribute('aria-pressed',String(on));queue()};
 el('axisMode').onclick=()=>{percent=!percent;el('axisMode').textContent=percent?'百分比':'絕對值';queue()};
 window.addEventListener('keydown',e=>{
  if(el('dialog').open||e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Escape'){if(selected!==null)closeQuery();else el('screen').classList.remove('focus');queue();return}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(selected===null)selected=activeIndex();shift(e.key==='ArrowLeft'?-1:1)}
  if(e.key==='+'||e.key==='=')zoom(.72);if(e.key==='-')zoom(1.4);
 });
 setupPointer();new ResizeObserver(queue).observe(el('screen'));window.addEventListener('resize',queue);
 days=Object.keys(data['1'].days).sort();day=days.at(-1);loadDay();layout();render();el('loading').hidden=true;
}
function decode64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function boot(){
 try{
  let bytes=decode64(el('payload').textContent.trim());
  if(el('payload').dataset.encrypted==='yes'){
   const k=new URLSearchParams(location.hash.slice(1)).get('k');
   if(!k){el('loading').textContent='請使用取得的完整看盤連結開啟（含 #k=）。';return}
   const key=await crypto.subtle.importKey('raw',decode64(k.replaceAll('-','+').replaceAll('_','/')),{name:'AES-GCM'},false,['decrypt']);
   bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12)));
  }
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  data=await new Response(stream).json();setup();
 }catch(e){el('loading').textContent='無法讀取看盤資料。請用最新版 Safari、Chrome 或 Edge 開啟完整連結。';console.error(e)}
}
boot();
